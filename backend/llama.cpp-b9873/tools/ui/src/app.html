<!doctype html>
<html lang="en">
	<head>
		<script>
			(function() {
				const savedHue = localStorage.getItem('deining_theme_hue');
				if (savedHue !== null) {
					document.documentElement.style.setProperty('--theme-hue', savedHue);
				} else {
					document.documentElement.style.setProperty('--theme-hue', '300');
				}
			})();
		</script>
		<meta charset="utf-8" />
		<!-- 泥濘: Live2D SDK & PixiJS (setup.ps1 にて公式より自動取得・配置) -->
		<script src="/deining/live2dcubismcore.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
		
		<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
		<link rel="icon" type="image/png" sizes="48x48" href="favicon.png" />
		<link rel="shortcut icon" href="favicon.ico" />

		<link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />

		<link rel="manifest" href="./manifest.webmanifest" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
		/>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.getRegistrations().then(function(registrations) {
					for (let registration of registrations) {
						registration.unregister();
						console.log('🧹 Legacy Service Worker unregistered');
					}
				});
			}
		</script>
		<!-- 泥濘: アバターコアロジック -->
		<script src="/deining/avatar-core-v2.js?v=120"></script>
	</body>
</html>
